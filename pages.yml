name: Publish consulting website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the current static website
        run: |
          mkdir -p _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github
          find _site -name .DS_Store -type f -delete
          test -s _site/index.html
          test -s _site/assets/style.css
          test -s _site/active-inference-guide.html
      # Three existing demos still use assets held in the original upload.
      # Current tracked files always take precedence over these legacy copies.
      - name: Preserve existing demo assets
        run: |
          git fetch --no-tags --depth=1 origin a32d51a7b5f66837909884990446b9f331499cd0
          git show a32d51a7b5f66837909884990446b9f331499cd0:site-part-1.zip > "$RUNNER_TEMP/consulting-legacy-assets.zip"
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          from zipfile import ZipFile

          paths = (
              "consulting/assets/habitat-make-tea-multiview.mp4",
              "active-inference-world-models/assets/habitat-make-tea-multiview.mp4",
              "active_inference_world_model_lab/app.js",
          )
          with ZipFile(Path(os.environ["RUNNER_TEMP"]) / "consulting-legacy-assets.zip") as archive:
              for name in paths:
                  destination = Path("_site") / name
                  if not destination.exists():
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_bytes(archive.read(name))
                  if destination.stat().st_size == 0:
                      raise RuntimeError(f"Empty demo asset: {name}")
          Path("_site/.nojekyll").touch()
          PYTHON
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
